        // ==========================================
        // 房间网络通道
        // ==========================================
        function setupMultiChannelRoom(roomCode) {
            const connTag = document.getElementById('connStatusTag');
            connTag.innerText = `⏳ 正在连接 #${roomCode} 房间...`;

            if (localBroadcast) {
                try { localBroadcast.close(); } catch (e) {}
            }
            if (typeof BroadcastChannel !== 'undefined') {
                localBroadcast = new BroadcastChannel('doudou_yaya_gomoku_v2_' + roomCode);
                localBroadcast.onmessage = (ev) => handleIncomingPacket(ev.data);
            }

            setupMqttChannel(roomCode);
            setupPeerJsChannel(roomCode);

            if (heartbeatTimer) clearInterval(heartbeatTimer);
            announceHello();
            setTimeout(announceHello, 400);
            setTimeout(announceHello, 1200);

            heartbeatTimer = setInterval(() => {
                if (gameMode !== 'online' || !currentRoomCode) return;
                sendRoomPacket('HEARTBEAT', {
                    blackPlayer: blackPlayerInfo,
                    whitePlayer: whitePlayerInfo
                });
                pruneOfflinePeers();
            }, 2500);
        }

        function setupMqttChannel(roomCode) {
            if (typeof mqtt === 'undefined') return;
            const newTopic = `doudou_yaya_gomoku_v2/room_${roomCode}`;

            if (mqttClient && mqttClient.connected) {
                if (mqttTopic && mqttTopic !== newTopic) {
                    try { mqttClient.unsubscribe(mqttTopic); } catch (e) {}
                }
                mqttTopic = newTopic;
                mqttClient.subscribe(mqttTopic, { qos: 0 }, () => {
                    updateConnectionBadge();
                    announceHello();
                });
                return;
            }

            mqttTopic = newTopic;
            if (mqttClient) {
                try { mqttClient.end(true); } catch (e) {}
            }

            const brokers = [
                'wss://broker.emqx.io:8084/mqtt',
                'wss://broker.hivemq.com:8884/mqtt'
            ];

            mqttClient = mqtt.connect(brokers[0], {
                clientId: 'doudou_' + myClientId + '_' + Math.random().toString(16).slice(2, 6),
                clean: true,
                connectTimeout: 5000,
                reconnectPeriod: 2000
            });

            mqttClient.on('connect', () => {
                if (!currentRoomCode) return;
                mqttClient.subscribe(mqttTopic, { qos: 0 }, () => {
                    updateConnectionBadge();
                    announceHello();
                });
            });

            mqttClient.on('message', (topic, message) => {
                if (topic !== mqttTopic) return;
                try {
                    const pkt = JSON.parse(message.toString());
                    handleIncomingPacket(pkt);
                } catch (e) {}
            });
        }

        function setupPeerJsChannel(roomCode) {
            if (typeof Peer === 'undefined') return;
            if (peerInstance) {
                try { peerInstance.destroy(); } catch (e) {}
                peerInstance = null;
            }
            peerConns = [];

            const slot1Id = `doudou-yaya-v2-${roomCode}-s1`;
            const slot2Id = `doudou-yaya-v2-${roomCode}-s2`;

            const p1 = new Peer(slot1Id);
            p1.on('open', () => {
                peerInstance = p1;
                updateConnectionBadge();
                p1.on('connection', bindPeerConn);
            });

            p1.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    const p2 = new Peer(slot2Id);
                    p2.on('open', () => {
                        peerInstance = p2;
                        updateConnectionBadge();
                        p2.on('connection', bindPeerConn);
                        const c = p2.connect(slot1Id, { reliable: true });
                        bindPeerConn(c);
                    });
                    p2.on('error', () => {
                        const pFallback = new Peer();
                        pFallback.on('open', () => {
                            peerInstance = pFallback;
                            const c1 = pFallback.connect(slot1Id, { reliable: true });
                            const c2 = pFallback.connect(slot2Id, { reliable: true });
                            bindPeerConn(c1);
                            bindPeerConn(c2);
                        });
                    });
                }
            });
        }

        function bindPeerConn(conn) {
            if (!conn) return;
            peerConns.push(conn);
            conn.on('open', () => {
                updateConnectionBadge();
                announceHello();
            });
            conn.on('data', (data) => {
                handleIncomingPacket(data);
            });
        }

        function sendRoomPacket(type, payload = {}) {
            if (!currentRoomCode) return;
            const pkt = {
                msgId: `${myClientId}_${++packetSeq}_${Date.now()}`,
                roomCode: currentRoomCode,
                senderId: myClientId,
                senderName: myName,
                joinedAt: myJoinedAt,
                type,
                payload,
                ts: Date.now()
            };
            seenPacketIds.add(pkt.msgId);

            if (localBroadcast) {
                try { localBroadcast.postMessage(pkt); } catch (e) {}
            }
            if (mqttClient && mqttClient.connected && mqttTopic) {
                try { mqttClient.publish(mqttTopic, JSON.stringify(pkt), { qos: 0 }); } catch (e) {}
            }
            peerConns.forEach(c => {
                if (c && c.open) {
                    try { c.send(pkt); } catch (e) {}
                }
            });
        }

        function announceHello() {
            if (gameMode !== 'online' || !currentRoomCode) return;
            sendRoomPacket('HELLO', {
                hasMoves: moves.length > 0 && !isSoloPracticeMoves,
                stateVersion
            });
        }

        function handleIncomingPacket(pkt) {
            if (!pkt || typeof pkt !== 'object') return;
            if (pkt.roomCode !== currentRoomCode || pkt.senderId === myClientId) return;
            if (pkt.msgId && seenPacketIds.has(pkt.msgId)) return;
            if (pkt.msgId) {
                seenPacketIds.add(pkt.msgId);
                if (seenPacketIds.size > 600) {
                    const first = seenPacketIds.values().next().value;
                    seenPacketIds.delete(first);
                }
            }

            const isNewPeer = !remotePeers.has(pkt.senderId);
            remotePeers.set(pkt.senderId, {
                id: pkt.senderId,
                name: pkt.senderName || '对方',
                joinedAt: pkt.joinedAt || pkt.ts || Date.now(),
                lastSeen: Date.now()
            });

            if (pkt.type === 'LEAVE') {
                remotePeers.delete(pkt.senderId);
                if (whitePlayerInfo && whitePlayerInfo.id === pkt.senderId) whitePlayerInfo = null;
                if (blackPlayerInfo && blackPlayerInfo.id === pkt.senderId) {
                    blackPlayerInfo = { id: myClientId, name: myName };
                    myOnlineColor = 1;
                }
                showRomanticToast(`👋 对方暂时离开了房间`);
                updateConnectionBadge();
                refreshGomokuUI();
                drawGomokuBoard();
                return;
            }

            if (pkt.type === 'ROLE_UPDATE') {
                const newRemoteName = pkt.payload?.name || pkt.senderName;
                if (blackPlayerInfo && blackPlayerInfo.id === pkt.senderId) blackPlayerInfo.name = newRemoteName;
                if (whitePlayerInfo && whitePlayerInfo.id === pkt.senderId) whitePlayerInfo.name = newRemoteName;
                refreshGomokuUI();
                return;
            }

            if (pkt.type === 'CHAT_MSG') {
                const msgText = String(pkt.payload?.text || '').trim();
                if (!msgText || msgText === '1114' || msgText === '818') return;
                const msgColor = pkt.payload.color || 2;
                const senderLabel = pkt.senderName || (msgColor === 1 ? '黑棋' : '白棋');
                showChatBubbleOnCard(msgColor, msgText, {
                    senderName: senderLabel,
                    isMine: false
                });
                return;
            }

            if (isNewPeer || pkt.type === 'HELLO') {
                onPeerJoinedOrHello(pkt, isNewPeer);
            }

            if (pkt.type === 'WELCOME_SYNC' || pkt.type === 'SYNC_STATE') {
                applyIncomingState(pkt.payload);
            } else if (pkt.type === 'HEARTBEAT') {
                if (!whitePlayerInfo || !blackPlayerInfo) {
                    onPeerJoinedOrHello(pkt, false);
                } else {
                    if (blackPlayerInfo.id === pkt.senderId) blackPlayerInfo.name = pkt.senderName;
                    if (whitePlayerInfo.id === pkt.senderId) whitePlayerInfo.name = pkt.senderName;
                    updateConnectionBadge();
                    refreshGomokuUI();
                }
            }
        }

        function onPeerJoinedOrHello(pkt, isNewPeer) {
            const remoteId = pkt.senderId;
            let remoteName = pkt.senderName || '对方';
            const remoteJoinedAt = pkt.joinedAt || Date.now();

            const iAmEarlier = (myJoinedAt < remoteJoinedAt) || (myJoinedAt === remoteJoinedAt && myClientId < remoteId);

            if (myName === remoteName) {
                if (!iAmEarlier && !userManuallyPickedRole) {
                    myName = remoteName === '豆豆宝宝' ? '芽芽' : '豆豆宝宝';
                    document.getElementById('roleDoudouBtn').classList.toggle('active', myName === '豆豆宝宝');
                    document.getElementById('roleYayaBtn').classList.toggle('active', myName === '芽芽');
                } else {
                    remoteName = myName === '豆豆宝宝' ? '芽芽' : '豆豆宝宝';
                }
            }

            if (isSoloPracticeMoves) {
                isSoloPracticeMoves = false;
                board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
                moves = [];
                currentTurn = 1;
                winner = 0;
                winLine = [];
                winReason = '';
            }

            const alreadyPaired =
                blackPlayerInfo && whitePlayerInfo &&
                ((blackPlayerInfo.id === myClientId && whitePlayerInfo.id === remoteId) ||
                 (blackPlayerInfo.id === remoteId && whitePlayerInfo.id === myClientId));

            if (!alreadyPaired) {
                if (iAmEarlier) {
                    myOnlineColor = 1;
                    blackPlayerInfo = { id: myClientId, name: myName };
                    whitePlayerInfo = { id: remoteId, name: remoteName };
                } else {
                    myOnlineColor = 2;
                    blackPlayerInfo = { id: remoteId, name: remoteName };
                    whitePlayerInfo = { id: myClientId, name: myName };
                }
            } else {
                if (blackPlayerInfo.id === myClientId) {
                    myOnlineColor = 1;
                    blackPlayerInfo.name = myName;
                    whitePlayerInfo.name = remoteName;
                } else {
                    myOnlineColor = 2;
                    whitePlayerInfo.name = myName;
                    blackPlayerInfo.name = remoteName;
                }
            }

            if (isNewPeer) {
                showRomanticToast(`🎉 ${remoteName} 已进入房间！双方连线成功，开始下棋吧`);
            }

            if (iAmEarlier || pkt.type === 'HELLO') {
                stateVersion++;
                sendRoomPacket('WELCOME_SYNC', buildStatePayload());
            }

            updateConnectionBadge();
            refreshGomokuUI();
            drawGomokuBoard();
        }

        function pruneOfflinePeers() {
            const now = Date.now();
            let changed = false;
            for (const [pid, info] of remotePeers.entries()) {
                if (now - info.lastSeen > 9000) {
                    remotePeers.delete(pid);
                    if (whitePlayerInfo && whitePlayerInfo.id === pid) whitePlayerInfo = null;
                    if (blackPlayerInfo && blackPlayerInfo.id === pid) {
                        blackPlayerInfo = { id: myClientId, name: myName };
                        myOnlineColor = 1;
                    }
                    changed = true;
                }
            }
            if (changed) {
                updateConnectionBadge();
                refreshGomokuUI();
                drawGomokuBoard();
            }
        }

        function updateConnectionBadge() {
            const connTag = document.getElementById('connStatusTag');
            const rosterEl = document.getElementById('roomRosterText');
            const isBothOnline = blackPlayerInfo && whitePlayerInfo && remotePeers.size > 0;

            if (isBothOnline) {
                connTag.innerText = `🟢 双方已实时连线 (#${currentRoomCode}房 · 2/2人在线)`;
                rosterEl.innerHTML = `🟢 <strong>2/2 双方已连线</strong> (${blackPlayerInfo.name} vs ${whitePlayerInfo.name})`;
            } else {
                connTag.innerText = `🟢 #${currentRoomCode || '5200'}房已就绪 (1/2人 · 等待对方进房)`;
                rosterEl.innerHTML = `🟡 <strong>1/2 在线</strong>：等待对方进入 #${currentRoomCode || '5200'} 房间...`;
            }
        }

        function buildStatePayload() {
            return {
                stateVersion,
                blackPlayer: blackPlayerInfo,
                whitePlayer: whitePlayerInfo,
                moves: moves,
                turn: currentTurn,
                winner: winner,
                winReason: winReason,
                winLine: winLine
            };
        }

        function broadcastRoomState() {
            if (gameMode !== 'online' || !currentRoomCode) return;
            stateVersion++;
            sendRoomPacket('SYNC_STATE', buildStatePayload());
        }

        function applyIncomingState(state) {
            if (!state) return;
            const prevMoveLen = moves.length;
            const prevWinner = winner;

            if (state.stateVersion && state.stateVersion > stateVersion) {
                stateVersion = state.stateVersion;
            }

            if (state.blackPlayer) blackPlayerInfo = state.blackPlayer;
            if (state.whitePlayer !== undefined) whitePlayerInfo = state.whitePlayer;

            if (blackPlayerInfo && blackPlayerInfo.id === myClientId) {
                myOnlineColor = 1;
                blackPlayerInfo.name = myName;
            } else if (whitePlayerInfo && whitePlayerInfo.id === myClientId) {
                myOnlineColor = 2;
                whitePlayerInfo.name = myName;
            }

            isSoloPracticeMoves = false;
            moves = state.moves || [];
            board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
            moves.forEach(m => {
                if (m.r >= 0 && m.r < BOARD_SIZE && m.c >= 0 && m.c < BOARD_SIZE) {
                    board[m.r][m.c] = m.p;
                }
            });

            currentTurn = state.turn || 1;
            winner = state.winner || 0;
            winReason = state.winReason || '';
            winLine = state.winLine || [];

            if (moves.length > prevMoveLen) {
                const last = moves[moves.length - 1];
                playStoneTap(last.p === 1);
            }
            if (winner !== 0 && prevWinner === 0) {
                playVictoryMelody();
                showVictoryBanner();
            } else if (winner === 0) {
                hideVictoryBanner();
            }

            updateConnectionBadge();
            refreshGomokuUI();
            drawGomokuBoard();
        }

        window.addEventListener('beforeunload', () => {
            if (gameMode === 'online' && currentRoomCode) {
                sendRoomPacket('LEAVE', {});
            }
        });

        // ==========================================
        // 下棋落子、胜负判定与 818 覆盖逻辑
        // ==========================================
        function resetBoardData() {
            board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
            moves = [];
            currentTurn = 1;
            winner = 0;
            winLine = [];
            winReason = '';
            isSoloPracticeMoves = false;
            aiThinking = false;
            pendingIntersection = null;
            updateConfirmButtonUI();
            hideVictoryBanner();
            updateConnectionBadge();
            refreshGomokuUI();
            drawGomokuBoard();
        }

        function checkFiveInARow(r, c, color) {
            const dirs = [[0,1], [1,0], [1,1], [1,-1]];
            for (const [dr, dc] of dirs) {
                const line = [[r, c]];
                let nr = r + dr, nc = c + dc;
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === color) {
                    line.push([nr, nc]);
                    nr += dr; nc += dc;
                }
                nr = r - dr; nc = c - dc;
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === color) {
                    line.unshift([nr, nc]);
                    nr -= dr; nc -= dc;
                }
                if (line.length >= 5) return line;
            }
            return null;
        }

        function placeStoneAt(r, c) {
            if (winner !== 0) {
                showRomanticToast('本局已结束，请点击「再来一局」🌸');
                return;
            }

            const currentOccupant = board[r][c];

            // 818 作弊逻辑判断：若开启且位置上有子，允许覆盖对方已落的棋子
            if (currentOccupant !== 0) {
                if (overrideCheatEnabled && currentOccupant !== currentTurn) {
                    showRomanticToast('✨ 触发覆盖特权，强行占领落点！');
                } else {
                    showRomanticToast('这里已经有棋子啦～');
                    return;
                }
            }

            if (gameMode === 'online') {
                const bothSeated = blackPlayerInfo && whitePlayerInfo && remotePeers.size > 0;
                if (bothSeated) {
                    if (currentTurn !== myOnlineColor) {
                        showRomanticToast('⏳ 现在轮到对方落子哟～');
                        return;
                    }
                    isSoloPracticeMoves = false;
                } else {
                    isSoloPracticeMoves = true;
                }
            } else if (gameMode === 'ai' && (aiThinking || currentTurn !== 1)) {
                return;
            }

            const stoneColor = currentTurn;
            board[r][c] = stoneColor;

            // 过滤历史中该位置的原有子，确保覆盖生效
            moves = moves.filter(m => !(m.r === r && m.c === c));
            moves.push({ r, c, p: stoneColor });
            playStoneTap(stoneColor === 1);

            const winPts = checkFiveInARow(r, c, stoneColor);
            if (winPts) {
                winner = stoneColor;
                winLine = winPts;
                winReason = 'five';
                playVictoryMelody();
                showVictoryBanner();
            } else if (moves.length >= BOARD_SIZE * BOARD_SIZE) {
                winner = 3;
                showVictoryBanner();
            } else {
                currentTurn = stoneColor === 1 ? 2 : 1;
            }

            refreshGomokuUI();
            drawGomokuBoard();

            if (gameMode === 'online') {
                broadcastRoomState();
            } else if (gameMode === 'ai' && winner === 0 && currentTurn === 2) {
                aiThinking = true;
                refreshGomokuUI();
                drawGomokuBoard();
                setTimeout(runYayaAiMove, 320);
            }
        }

        window.handleSwapColors = function() {
            if (gameMode !== 'online') return;
            if (!blackPlayerInfo || !whitePlayerInfo) {
                showRomanticToast('⏳ 等对方进入房间后即可互换黑白棋哟～');
                return;
            }
            const temp = blackPlayerInfo;
            blackPlayerInfo = whitePlayerInfo;
            whitePlayerInfo = temp;
            myOnlineColor = myOnlineColor === 1 ? 2 : 1;
            resetBoardData();
            broadcastRoomState();
            showRomanticToast(`🔃 已互换黑白棋！现在由 ${blackPlayerInfo.name} 执黑先行`);
        };

        function runYayaAiMove() {
            if (winner !== 0 || gameMode !== 'ai') {
                aiThinking = false;
                return;
            }
            let bestMove = { r: 7, c: 7 };
            if (moves.length > 0) {
                if (aiLevel === 'hard') {
                    bestMove = computeGrandmasterBestMove(2);
                } else {
                    const candidates = [];
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        for (let c = 0; c < BOARD_SIZE; c++) {
                            if (board[r][c] !== 0) continue;
                            let hasNeighbor = false;
                            for (let dr = -2; dr <= 2 && !hasNeighbor; dr++) {
                                for (let dc = -2; dc <= 2 && !hasNeighbor; dc++) {
                                    const nr = r + dr, nc = c + dc;
                                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] !== 0) {
                                        hasNeighbor = true;
                                    }
                                }
                            }
                            if (hasNeighbor) {
                                const atk = evaluateCellScore(r, c, 2);
                                const def = evaluateCellScore(r, c, 1);
                                const center = 14 - (Math.abs(r - 7) + Math.abs(c - 7));
                                let score = atk >= 100000 ? 2000000 : def >= 100000 ? 1000000 : atk + def * (aiLevel === 'easy' ? 0.75 : 1.1) + center;
                                if (aiLevel === 'easy') score += (Math.random() - 0.5) * 600;
                                candidates.push({ r, c, score });
                            }
                        }
                    }
                    candidates.sort((a, b) => b.score - a.score);
                    if (candidates.length > 0) bestMove = candidates[0];
                }
            }

            aiThinking = false;
            placeStoneAt(bestMove.r, bestMove.c);
        }

        function evaluateCellScore(r, c, color) {
            const dirs = [[0,1], [1,0], [1,1], [1,-1]];
            let total = 0;
            for (const [dr, dc] of dirs) {
                let cnt = 1, open = 0;
                let nr = r + dr, nc = c + dc;
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === color) { cnt++; nr += dr; nc += dc; }
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === 0) open++;

                nr = r - dr; nc = c - dc;
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === color) { cnt++; nr -= dr; nc -= dc; }
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === 0) open++;

                if (cnt >= 5) total += 100000;
                else if (cnt === 4) total += open === 2 ? 22000 : open === 1 ? 4000 : 0;
                else if (cnt === 3) total += open === 2 ? 3200 : open === 1 ? 400 : 0;
                else if (cnt === 2) total += open === 2 ? 350 : 50;
            }
            return total;
        }

        // ==========================================
        // 棋盘渲染与交互
        // ==========================================
        const canvas = document.getElementById('gomokuCanvas');
        const ctx = canvas.getContext('2d');
        let metrics = { size: 420, pad: 28, cell: 26 };

        function resizeBoardCanvas() {
            const box = canvas.parentElement.getBoundingClientRect();
            if (box.width < 50) return;
            const dpr = window.devicePixelRatio || 1;
            const cssSize = Math.floor(Math.min(box.width, box.height) - 10);

            canvas.style.width = cssSize + 'px';
            canvas.style.height = cssSize + 'px';
            canvas.width = Math.floor(cssSize * dpr);
            canvas.height = Math.floor(cssSize * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const pad = Math.max(22, Math.floor(cssSize * 0.068));
            const cell = (cssSize - pad * 2) / (BOARD_SIZE - 1);
            metrics = { size: cssSize, pad, cell };
            drawGomokuBoard();
        }
        window.addEventListener('resize', resizeBoardCanvas);

        function drawGomokuBoard() {
            const { size, pad, cell } = metrics;
            ctx.clearRect(0, 0, size, size);

            ctx.strokeStyle = isLightsOff ? 'rgba(42, 24, 10, 0.72)' : 'rgba(72, 40, 14, 0.78)';
            ctx.lineWidth = 1.1;
            for (let i = 0; i < BOARD_SIZE; i++) {
                const p = pad + i * cell;
                ctx.beginPath(); ctx.moveTo(pad, p); ctx.lineTo(size - pad, p); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(p, pad); ctx.lineTo(p, size - pad); ctx.stroke();
            }

            ctx.fillStyle = isLightsOff ? 'rgba(42, 24, 10, 0.78)' : 'rgba(72, 40, 14, 0.8)';
            ctx.font = `600 ${Math.max(9, Math.floor(cell * 0.34))}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 0; i < BOARD_SIZE; i++) {
                const pos = pad + i * cell;
                ctx.fillText(COL_LETTERS[i], pos, pad * 0.42);
                ctx.fillText(String(BOARD_SIZE - i), pad * 0.42, pos);
            }

            for (const [sr, sc] of STAR_COORDS) {
                ctx.beginPath();
                ctx.arc(pad + sc * cell, pad + sr * cell, Math.max(3, cell * 0.12), 0, Math.PI * 2);
                ctx.fillStyle = isLightsOff ? '#2f1b0a' : '#48280e';
                ctx.fill();
            }

            // 大师推荐落点 (1114)
            if (masterCheatEnabled && masterRecommendedMove && winner === 0) {
                const { r: mr, c: mc } = masterRecommendedMove;
                if (board[mr][mc] === 0) {
                    const mx = pad + mc * cell;
                    const my = pad + mr * cell;
                    const rad = cell * 0.44;
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(mx, my, rad, 0, Math.PI * 2);

                    if (currentTurn === 1) {
                        const g = ctx.createRadialGradient(mx - rad * 0.3, my - rad * 0.3, rad * 0.08, mx, my, rad);
                        g.addColorStop(0, 'rgba(130, 130, 130, 0.52)');
                        g.addColorStop(0.5, 'rgba(55, 55, 55, 0.42)');
                        g.addColorStop(1, 'rgba(20, 20, 20, 0.35)');
                        ctx.fillStyle = g;
                        ctx.fill();
                        ctx.setLineDash([3, 3]);
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
                        ctx.lineWidth = 1.4;
                        ctx.stroke();
                    } else {
                        const g = ctx.createRadialGradient(mx - rad * 0.3, my - rad * 0.3, rad * 0.08, mx, my, rad);
                        g.addColorStop(0, 'rgba(255, 255, 255, 0.72)');
                        g.addColorStop(0.6, 'rgba(245, 242, 238, 0.58)');
                        g.addColorStop(1, 'rgba(210, 202, 194, 0.48)');
                        ctx.fillStyle = g;
                        ctx.fill();
                        ctx.setLineDash([3, 3]);
                        ctx.strokeStyle = 'rgba(110, 75, 40, 0.55)';
                        ctx.lineWidth = 1.4;
                        ctx.stroke();
                    }
                    ctx.restore();
                }
            }

            // 准星与落子悬浮预览
            const aim = pendingIntersection || hoverIntersection;
            if (aim && winner === 0 && (board[aim.r][aim.c] === 0 || (overrideCheatEnabled && board[aim.r][aim.c] !== currentTurn))) {
                const ax = pad + aim.c * cell;
                const ay = pad + aim.r * cell;
                const rad = cell * 0.44;
                ctx.save();
                ctx.beginPath();
                ctx.arc(ax, ay, rad, 0, Math.PI * 2);
                ctx.fillStyle = currentTurn === 1 ? 'rgba(20,20,20,0.35)' : 'rgba(255,255,255,0.55)';
                ctx.fill();
                if (pendingIntersection) {
                    ctx.strokeStyle = '#ff4d79';
                    ctx.lineWidth = 2.2;
                    ctx.stroke();
                }
                ctx.restore();
            }

            // 绘制棋子
            const rStone = cell * 0.45;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const v = board[r][c];
                    if (v === 0) continue;
                    const cx = pad + c * cell;
                    const cy = pad + r * cell;

                    ctx.save();
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.38)';
                    ctx.shadowBlur = rStone * 0.4;
                    ctx.shadowOffsetX = rStone * 0.1;
                    ctx.shadowOffsetY = rStone * 0.15;

                    ctx.beginPath();
                    ctx.arc(cx, cy, rStone, 0, Math.PI * 2);
                    if (v === 1) {
                        const g = ctx.createRadialGradient(cx - rStone * 0.3, cy - rStone * 0.3, rStone * 0.08, cx, cy, rStone);
                        g.addColorStop(0, '#666');
                        g.addColorStop(0.3, '#262626');
                        g.addColorStop(1, '#080808');
                        ctx.fillStyle = g;
                    } else {
                        const g = ctx.createRadialGradient(cx - rStone * 0.3, cy - rStone * 0.3, rStone * 0.08, cx, cy, rStone);
                        if (isLightsOff) {
                            g.addColorStop(0, '#ebe7e0');
                            g.addColorStop(0.7, '#d5cfc6');
                            g.addColorStop(1, '#b0a99f');
                        } else {
                            g.addColorStop(0, '#ffffff');
                            g.addColorStop(0.7, '#f2efec');
                            g.addColorStop(1, '#cdc6be');
                        }
                        ctx.fillStyle = g;
                    }
                    ctx.fill();
                    ctx.restore();
                }
            }

            // 最新手红点
            if (moves.length > 0) {
                const last = moves[moves.length - 1];
                const lx = pad + last.c * cell;
                const ly = pad + last.r * cell;
                ctx.beginPath();
                ctx.arc(lx, ly, Math.max(3.5, cell * 0.15), 0, Math.PI * 2);
                ctx.fillStyle = '#ff3b6b';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }

            // 五子连珠高光
            if (winLine && winLine.length >= 5) {
                const p1 = winLine[0];
                const p2 = winLine[winLine.length - 1];
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(pad + p1[1] * cell, pad + p1[0] * cell);
                ctx.lineTo(pad + p2[1] * cell, pad + p2[0] * cell);
                ctx.strokeStyle = 'rgba(255, 77, 121, 0.88)';
                ctx.lineWidth = Math.max(4, cell * 0.16);
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.restore();
            }
        }

        function getGridPointFromEvent(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            const { pad, cell } = metrics;
            const c = Math.round((x - pad) / cell);
            const r = Math.round((y - pad) / cell);
            if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) return null;
            return { r, c };
        }

        window.toggleAimMode = function() {
            if (aimSetting === 'auto') aimSetting = 'on';
            else if (aimSetting === 'on') aimSetting = 'off';
            else aimSetting = 'auto';

            const txt = aimSetting === 'auto' ? '自动' : aimSetting === 'on' ? '开启' : '关闭';
            document.getElementById('aimModeBtn').innerText = `🎯 防误触: ${txt}`;
            pendingIntersection = null;
            updateConfirmButtonUI();
            drawGomokuBoard();
        };

        function shouldUseTwoStepConfirm() {
            if (aimSetting === 'on') return true;
            if (aimSetting === 'off') return false;
            return isTouchUsed || window.innerWidth < 640;
        }

        function updateConfirmButtonUI() {
            const btn = document.getElementById('confirmMoveBtn');
            const span = document.getElementById('confirmCoordText');
            if (pendingIntersection && winner === 0) {
                span.innerText = `${COL_LETTERS[pendingIntersection.c]}${BOARD_SIZE - pendingIntersection.r}`;
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
        }

        window.confirmPendingStone = function() {
            if (!pendingIntersection) return;
            const { r, c } = pendingIntersection;
            pendingIntersection = null;
            updateConfirmButtonUI();
            placeStoneAt(r, c);
        };

        canvas.addEventListener('touchstart', () => { isTouchUsed = true; }, { passive: true });

        canvas.addEventListener('mousemove', (e) => {
            if (isTouchUsed) return;
            const pt = getGridPointFromEvent(e.clientX, e.clientY);
            if (pt?.r !== hoverIntersection?.r || pt?.c !== hoverIntersection?.c) {
                hoverIntersection = pt;
                drawGomokuBoard();
            }
        });

        canvas.addEventListener('mouseleave', () => {
            hoverIntersection = null;
            drawGomokuBoard();
        });

        canvas.addEventListener('click', (e) => {
            const pt = getGridPointFromEvent(e.clientX, e.clientY);
            if (!pt) return;

            // 未开启 818 时已有棋子直接拦截；开启 818 时若为己方棋子仍拦截，对方棋子允许覆盖
            if (board[pt.r][pt.c] !== 0) {
                if (!overrideCheatEnabled || board[pt.r][pt.c] === currentTurn) {
                    showRomanticToast('这里已经有棋子啦～');
                    return;
                }
            }

            if (gameMode === 'online' && blackPlayerInfo && whitePlayerInfo && remotePeers.size > 0 && currentTurn !== myOnlineColor) {
                showRomanticToast('⏳ 现在轮到对方落子哟～');
                return;
            }

            if (shouldUseTwoStepConfirm()) {
                if (pendingIntersection && pendingIntersection.r === pt.r && pendingIntersection.c === pt.c) {
                    confirmPendingStone();
                } else {
                    pendingIntersection = pt;
                    updateConfirmButtonUI();
                    drawGomokuBoard();
                }
            } else {
                placeStoneAt(pt.r, pt.c);
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            applyLightsOffUI();
            updateDynamicPhrasesUI();
            updateWinRateDisplay();
            const params = new URLSearchParams(window.location.search);
            const roomParam = params.get('room');
            if (roomParam) {
                selectIdentity('芽芽', true);
                openGomokuRoom(roomParam);
            }
        });
    </script>
</body>
</html>
