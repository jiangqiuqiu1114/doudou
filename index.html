<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>doudou</title>
</head>
<body>
    <h2>欢迎来到 doudou！</h2>
    <input type="text" id="messageInput" placeholder="在这里输入要推送的内容...">
    <!-- 按钮初始文字修改为“召唤芽芽” -->
    <button id="sendBtn">召唤芽芽</button>

    <script>
        function logPageVisit() {
            const logData = new URLSearchParams();
            logData.append('title', '👀 访客提醒');
            logData.append('body', 'doudou 网页刚刚被打开或刷新了！');
            logData.append('group', 'log'); 
            logData.append('ttl', '600');

            fetch('https://api.day.app/t7Ay4FrKptb7NrhMw5xBG7', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: logData
            }).catch(error => console.error('后台日志推送失败:', error)); 
        }

        window.addEventListener('load', logPageVisit);

        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');

        sendBtn.addEventListener('click', function() {
            const inputValue = messageInput.value.trim();

            if (!inputValue) {
                alert('请先输入内容！');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerText = '推送中...';

            const data = new URLSearchParams();
            data.append('title', 'doudou 网页留言'); 
            data.append('body', inputValue);         
            data.append('group', 'example');
            data.append('ttl', '600');

            fetch('https://api.day.app/t7Ay4FrKptb7NrhMw5xBG7', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: data
            })
            .then(response => response.json())
            .then(data => {
                alert('推送成功！');
                messageInput.value = ''; 
            })
            .catch(error => {
                alert('推送失败，请检查网络！');
                console.error('Error:', error);
            })
            .finally(() => {
                // 推送结束后（无论成功失败），恢复为“召唤芽芽”
                sendBtn.disabled = false;
                sendBtn.innerText = '召唤芽芽';
            });
        });
    </script>
</body>
</html>
