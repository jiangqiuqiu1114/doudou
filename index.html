    <script>
        // ==========================================
        // 0. 唯美轻提示函数
        // ==========================================
        function showRomanticToast(msg) {
            const container = document.getElementById('toastContainer');
            const div = document.createElement('div');
            div.className = 'toast-item';
            div.innerText = msg;
            container.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                div.style.transition = 'opacity 0.3s ease';
                setTimeout(() => div.remove(), 300);
            }, 2600);
        }

        // ==========================================
        // 🎵 音乐播放控制逻辑 (100% 保留原有逻辑)
        // ==========================================
        const bgMusic = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');
        let isMusicPlaying = false;

        function togglePlay() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicToggle.classList.remove('playing');
            } else {
                bgMusic.play().catch(() => {});
                musicToggle.classList.add('playing');
            }
            isMusicPlaying = !isMusicPlaying;
        }

        musicToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            togglePlay();
        });

        document.body.addEventListener('click', function() {
            if (!isMusicPlaying) {
                togglePlay();
            }
        }, { once: true });

        // ==========================================
        // 功能 1：无感推送网页访问日志 (100% 保留原有逻辑)
        // ==========================================
        const BARK_ENDPOINT = 'https://api.day.app/t7Ay4FrKptb7NrhMw5xBG7';

        function logPageVisit() {
            const logData = new URLSearchParams();
            logData.append('title', '👀 豆豆宝宝来啦');
            logData.append('body', '豆豆宝宝刚刚打开或刷新了网页！');
            logData.append('group', 'log');
            logData.append('isArchive', '1');

            fetch(BARK_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: logData
            }).catch(error => console.error('后台日志推送失败:', error));
        }

        window.addEventListener('load', logPageVisit);

        // ==========================================
        // UI 辅助：输入框非空判断与清空按钮交互
        // ==========================================
        const messageInput = document.getElementById('messageInput');
        const clearBtn = document.getElementById('clearBtn');

        messageInput.addEventListener('input', function() {
            clearBtn.style.display = messageInput.value.length > 0 ? 'block' : 'none';
        });

        clearBtn.addEventListener('click', function() {
            messageInput.value = '';
            clearBtn.style.display = 'none';
            messageInput.focus();
        });

        // ==========================================
        // 功能 2：手动点击「召唤芽芽」按钮推送
        // ==========================================
        const sendBtn = document.getElementById('sendBtn');

        sendBtn.addEventListener('click', function() {
            const inputValue = messageInput.value.trim();

            if (!inputValue) {
                showRomanticToast('💌 请先输入想对芽芽说的话呀！');
                messageInput.focus();
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerText = '发送中...';

            const data = new URLSearchParams();
            data.append('title', 'doudou 网页留言');
            data.append('body', inputValue);
            data.append('group', 'example');
            data.append('isArchive', '1');

            fetch(BARK_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: data
            })
            .then(response => response.json())
            .then(() => {
                showRomanticToast('发送成功啦！芽芽收到留言咯 🌸');
                messageInput.value = '';
                clearBtn.style.display = 'none';
            })
            .catch(error => {
                showRomanticToast('发送失败，请检查网络！');
                console.error('Error:', error);
            })
            .finally(() => {
                sendBtn.disabled = false;
                sendBtn.innerText = '召唤芽芽';
            });
        });

        // ==========================================
        // 功能 3：卡片视图与五子棋对战屋丝滑切换
        // ==========================================
        const messageCardView = document.getElementById('messageCardView');
        const gomokuView = document.getElementById('gomokuView');
        const gomokuBtn = document.getElementById('gomokuBtn');
        const backToCardBtn = document.getElementById('backToCardBtn');

        function openGomokuRoom(defaultRoom = '5200') {
            messageCardView.style.display = 'none';
            gomokuView.style.display = 'block';
            setTimeout(() => {
                resizeBoardCanvas();
                if (!currentRoomCode && gameMode === 'online') {
                    joinCoupleRoom(defaultRoom);
                }
            }, 30);
        }

        gomokuBtn.addEventListener('click', function() {
            openGomokuRoom('5200');
        });

        backToCardBtn.addEventListener('click', function() {
            gomokuView.style.display = 'none';
            messageCardView.style.display = 'block';
        });

        // ==========================================
        // 功能 4：一键通过 Bark 呼叫芽芽进房下棋
        // ==========================================
        window.notifyYayaToPlay = function() {
            const btn = document.getElementById('notifyYayaBtn');
            const roomCode = currentRoomCode || '5200';
            const pageUrl = window.location.origin + window.location.pathname + '?room=' + roomCode;

            btn.disabled = true;
            btn.innerHTML = '<span>⏳</span><span>正在呼叫芽芽...</span>';

            const payload = new URLSearchParams();
            payload.append('title', '♟️ 豆豆喊你下五子棋啦！');
            payload.append('body', `${myName}已经在五子棋【${roomCode} 房间】摆好棋盘等你啦，点击通知直接进房对战吧 ❤️`);
            payload.append('group', 'gomoku');
            payload.append('isArchive', '1');
            payload.append('url', pageUrl);

            fetch(BARK_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: payload
            })
            .then(() => {
                showRomanticToast(`🔔 已向芽芽手机发送【${roomCode}房】对战召唤！`);
            })
            .catch(() => {
                showRomanticToast('呼叫发送失败，请检查网络');
            })
            .finally(() => {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = '<span>🔔</span><span>一键发通知喊芽芽进房下棋</span>';
                }, 2000);
            });
        };

        // ==========================================
        // 功能 5：Web Audio 拟真落子与获胜音效
        // ==========================================
        let soundEnabled = true;
        let audioCtx = null;

        function playStoneTap(isBlack = true) {
            if (!soundEnabled) return;
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx && AudioContextClass) audioCtx = new AudioContextClass();
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(isBlack ? 700 : 850, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.06);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.07);
            } catch (e) {}
        }

        function playVictoryMelody() {
            if (!soundEnabled) return;
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx && AudioContextClass) audioCtx = new AudioContextClass();
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((f, idx) => {
                    const t = audioCtx.currentTime + idx * 0.09;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, t);
                    gain.gain.setValueAtTime(0.22, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(t);
                    osc.stop(t + 0.36);
                });
            } catch (e) {}
        }

        window.toggleSoundEffect = function() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? '🔊 音效' : '🔇 静音';
            showRomanticToast(soundEnabled ? '🔊 已开启棋子音效' : '🔇 已静音棋子音效');
        };

        // ==========================================
        // 功能 6：五子棋核心状态与三通道实时联机引擎
        // (MQTT over WSS + PeerJS P2P + BroadcastChannel)
        // ==========================================
        const BOARD_SIZE = 15;
        const COL_LETTERS = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O'];
        const STAR_COORDS = [[3,3],[3,11],[7,7],[11,3],[11,11]];

        let gameMode = 'online'; // 'online' | 'ai' | 'local'
        let myName = '豆豆宝宝';
        let userManuallyPickedRole = false;
        let myClientId = sessionStorage.getItem('doudou_gomoku_cid');
        if (!myClientId) {
            myClientId = 'u_' + Math.random().toString(36).slice(2, 10);
            sessionStorage.setItem('doudou_gomoku_cid', myClientId);
        }
        let myJoinedAt = Date.now();

        let board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
        let moves = []; // { r, c, p }
        let currentTurn = 1; // 1 = Black, 2 = White
        let winner = 0; // 0 = playing, 1 = Black, 2 = White, 3 = Draw
        let winLine = [];
        let winReason = '';
        let stateVersion = 0;
        let isSoloPracticeMoves = false; // 标记是否为等待对方进房前的单人试下

        // 在线房间与座位状态
        let currentRoomCode = '';
        let myOnlineColor = 1; // 1 = Black, 2 = White
        let blackPlayerInfo = { id: myClientId, name: myName };
        let whitePlayerInfo = null;
        let remotePeers = new Map(); // id -> { id, name, joinedAt, lastSeen }
        let seenPacketIds = new Set();
        let packetSeq = 0;

        // 实时通信通道实例
        let mqttClient = null;
        let mqttTopic = '';
        let localBroadcast = null;
        let peerInstance = null;
        let peerConns = [];
        let heartbeatTimer = null;

        // AI 状态
        let aiLevel = 'medium';
        let aiThinking = false;

        // 触屏防误触状态
        let hoverIntersection = null;
        let pendingIntersection = null;
        let aimSetting = 'auto'; // 'auto' | 'on' | 'off'
        let isTouchUsed = false;

        // 切换我是豆豆/我是芽芽
        window.selectIdentity = function(name, isManual = false) {
            myName = name;
            if (isManual) userManuallyPickedRole = true;
            document.getElementById('roleDoudouBtn').classList.toggle('active', name === '豆豆宝宝');
            document.getElementById('roleYayaBtn').classList.toggle('active', name === '芽芽');

            if (blackPlayerInfo && blackPlayerInfo.id === myClientId) {
                blackPlayerInfo.name = myName;
            }
            if (whitePlayerInfo && whitePlayerInfo.id === myClientId) {
                whitePlayerInfo.name = myName;
            }

            if (gameMode === 'online' && currentRoomCode) {
                sendRoomPacket('ROLE_UPDATE', { name: myName });
                broadcastRoomState();
            }
            refreshGomokuUI();
            if (isManual) showRomanticToast(`✨ 已切换身份为：${myName}`);
        };

        // 进入指定房间
        window.joinCoupleRoom = function(roomCode) {
            if (gameMode !== 'online') {
                switchMode('online');
            }
            const cleanCode = String(roomCode).trim().toUpperCase();
            if (!cleanCode) return;

            // 通知旧房间离开
            if (currentRoomCode && currentRoomCode !== cleanCode) {
                sendRoomPacket('LEAVE', {});
            }

            currentRoomCode = cleanCode;
            myJoinedAt = Date.now();
            remotePeers.clear();
            myOnlineColor = 1;
            blackPlayerInfo = { id: myClientId, name: myName };
            whitePlayerInfo = null;

            document.getElementById('roomCodeBadge').innerText = `房间 #${cleanCode}`;
            document.getElementById('customRoomInput').value = cleanCode;

            resetBoardData();
            setupMultiChannelRoom(cleanCode);
            showRomanticToast(`💖 已进入【${cleanCode}】专属房间！`);
        };

        window.joinCustomRoomInput = function() {
            const val = document.getElementById('customRoomInput').value.trim();
            if (!val) {
                showRomanticToast('请输入房间号（如 5200）');
                return;
            }
            joinCoupleRoom(val);
        };

        // ==========================================
        // 核心：三通道混合实时房间网络 (MQTT + BroadcastChannel + PeerJS)
        // ==========================================
        function setupMultiChannelRoom(roomCode) {
            const connTag = document.getElementById('connStatusTag');
            connTag.innerText = `⏳ 正在连接 #${roomCode} 房间...`;

            // 1. 同设备跨标签页极速通道 (BroadcastChannel)
            if (localBroadcast) {
                try { localBroadcast.close(); } catch (e) {}
            }
            if (typeof BroadcastChannel !== 'undefined') {
                localBroadcast = new BroadcastChannel('doudou_yaya_gomoku_v2_' + roomCode);
                localBroadcast.onmessage = (ev) => handleIncomingPacket(ev.data);
            }

            // 2. 跨网云端实时信令通道 (MQTT over WSS，穿透一切手机 5G / Wi-Fi NAT)
            setupMqttChannel(roomCode);

            // 3. PeerJS WebRTC P2P 辅助直连通道
            setupPeerJsChannel(roomCode);

            // 4. 启动房间握手与定时在线心跳
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            announceHello();
            setTimeout(announceHello, 400);
            setTimeout(announceHello, 1200);

            heartbeatTimer = setInterval(() => {
                if (gameMode !== 'online' || !currentRoomCode) return;
                sendRoomPacket('HEARTBEAT', {
                    blackPlayer: blackPlayerInfo,
                    whitePlayer: whitePlayerInfo
                });
                pruneOfflinePeers();
            }, 2500);
        }

        function setupMqttChannel(roomCode) {
            if (typeof mqtt === 'undefined') return;
            const newTopic = `doudou_yaya_gomoku_v2/room_${roomCode}`;

            if (mqttClient && mqttClient.connected) {
                if (mqttTopic && mqttTopic !== newTopic) {
                    try { mqttClient.unsubscribe(mqttTopic); } catch (e) {}
                }
                mqttTopic = newTopic;
                mqttClient.subscribe(mqttTopic, { qos: 0 }, () => {
                    updateConnectionBadge();
                    announceHello();
                });
                return;
            }

            mqttTopic = newTopic;
            if (mqttClient) {
                try { mqttClient.end(true); } catch (e) {}
            }

            const brokers = [
                'wss://broker.emqx.io:8084/mqtt',
                'wss://broker.hivemq.com:8884/mqtt'
            ];

            mqttClient = mqtt.connect(brokers[0], {
                clientId: 'doudou_' + myClientId + '_' + Math.random().toString(16).slice(2, 6),
                clean: true,
                connectTimeout: 5000,
                reconnectPeriod: 2000
            });

            mqttClient.on('connect', () => {
                if (!currentRoomCode) return;
                mqttClient.subscribe(mqttTopic, { qos: 0 }, () => {
                    updateConnectionBadge();
                    announceHello();
                });
            });

            mqttClient.on('message', (topic, message) => {
                if (topic !== mqttTopic) return;
                try {
                    const pkt = JSON.parse(message.toString());
                    handleIncomingPacket(pkt);
                } catch (e) {}
            });
        }

        function setupPeerJsChannel(roomCode) {
            if (typeof Peer === 'undefined') return;
            if (peerInstance) {
                try { peerInstance.destroy(); } catch (e) {}
                peerInstance = null;
            }
            peerConns = [];

            const slot1Id = `doudou-yaya-v2-${roomCode}-s1`;
            const slot2Id = `doudou-yaya-v2-${roomCode}-s2`;

            const p1 = new Peer(slot1Id);
            p1.on('open', () => {
                peerInstance = p1;
                updateConnectionBadge();
                p1.on('connection', bindPeerConn);
            });

            p1.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    const p2 = new Peer(slot2Id);
                    p2.on('open', () => {
                        peerInstance = p2;
                        updateConnectionBadge();
                        p2.on('connection', bindPeerConn);
                        const c = p2.connect(slot1Id, { reliable: true });
                        bindPeerConn(c);
                    });
                    p2.on('error', () => {
                        const pFallback = new Peer();
                        pFallback.on('open', () => {
                            peerInstance = pFallback;
                            const c1 = pFallback.connect(slot1Id, { reliable: true });
                            const c2 = pFallback.connect(slot2Id, { reliable: true });
                            bindPeerConn(c1);
                            bindPeerConn(c2);
                        });
                    });
                }
            });
        }

        function bindPeerConn(conn) {
            if (!conn) return;
            peerConns.push(conn);
            conn.on('open', () => {
                updateConnectionBadge();
                announceHello();
            });
            conn.on('data', (data) => {
                handleIncomingPacket(data);
            });
        }

        function sendRoomPacket(type, payload = {}) {
            if (!currentRoomCode) return;
            const pkt = {
                msgId: `${myClientId}_${++packetSeq}_${Date.now()}`,
                roomCode: currentRoomCode,
                senderId: myClientId,
                senderName: myName,
                joinedAt: myJoinedAt,
                type,
                payload,
                ts: Date.now()
            };
            seenPacketIds.add(pkt.msgId);

            // 1. BroadcastChannel 发送
            if (localBroadcast) {
                try { localBroadcast.postMessage(pkt); } catch (e) {}
            }
            // 2. MQTT 云端发送
            if (mqttClient && mqttClient.connected && mqttTopic) {
                try { mqttClient.publish(mqttTopic, JSON.stringify(pkt), { qos: 0 }); } catch (e) {}
            }
            // 3. PeerJS 发送
            peerConns.forEach(c => {
                if (c && c.open) {
                    try { c.send(pkt); } catch (e) {}
                }
            });
        }

        function announceHello() {
            if (gameMode !== 'online' || !currentRoomCode) return;
            sendRoomPacket('HELLO', {
                hasMoves: moves.length > 0 && !isSoloPracticeMoves,
                stateVersion
            });
        }

        // 处理收到的所有房间数据包
        function handleIncomingPacket(pkt) {
            if (!pkt || typeof pkt !== 'object') return;
            if (pkt.roomCode !== currentRoomCode || pkt.senderId === myClientId) return;
            if (pkt.msgId && seenPacketIds.has(pkt.msgId)) return;
            if (pkt.msgId) {
                seenPacketIds.add(pkt.msgId);
                if (seenPacketIds.size > 600) {
                    const first = seenPacketIds.values().next().value;
                    seenPacketIds.delete(first);
                }
            }

            const isNewPeer = !remotePeers.has(pkt.senderId);
            remotePeers.set(pkt.senderId, {
                id: pkt.senderId,
                name: pkt.senderName || '芽芽',
                joinedAt: pkt.joinedAt || pkt.ts || Date.now(),
                lastSeen: Date.now()
            });

            if (pkt.type === 'LEAVE') {
                remotePeers.delete(pkt.senderId);
                if (whitePlayerInfo && whitePlayerInfo.id === pkt.senderId) whitePlayerInfo = null;
                if (blackPlayerInfo && blackPlayerInfo.id === pkt.senderId) {
                    blackPlayerInfo = { id: myClientId, name: myName };
                    myOnlineColor = 1;
                }
                showRomanticToast(`👋 对方暂时离开了房间`);
                updateConnectionBadge();
                refreshGomokuUI();
                return;
            }

            if (pkt.type === 'ROLE_UPDATE') {
                const newRemoteName = pkt.payload?.name || pkt.senderName;
                if (blackPlayerInfo && blackPlayerInfo.id === pkt.senderId) blackPlayerInfo.name = newRemoteName;
                if (whitePlayerInfo && whitePlayerInfo.id === pkt.senderId) whitePlayerInfo.name = newRemoteName;
                refreshGomokuUI();
                return;
            }

            if (pkt.type === 'CHAT_MSG') {
                showChatBubbleOnCard(pkt.payload.color, pkt.payload.text);
                return;
            }

            // 如果是新进房的伙伴或者收到 HELLO 握手，协调双方黑白座位
            if (isNewPeer || pkt.type === 'HELLO') {
                onPeerJoinedOrHello(pkt, isNewPeer);
            }

            if (pkt.type === 'WELCOME_SYNC' || pkt.type === 'SYNC_STATE') {
                applyIncomingState(pkt.payload);
            } else if (pkt.type === 'HEARTBEAT') {
                // 心跳时如果对方还没有入座，自动补齐座位
                if (!whitePlayerInfo || !blackPlayerInfo) {
                    onPeerJoinedOrHello(pkt, false);
                } else {
                    if (blackPlayerInfo.id === pkt.senderId) blackPlayerInfo.name = pkt.senderName;
                    if (whitePlayerInfo.id === pkt.senderId) whitePlayerInfo.name = pkt.senderName;
                    updateConnectionBadge();
                    refreshGomokuUI();
                }
            }
        }

        // 当第二个人进入房间时的座位分配与自动开局逻辑
        function onPeerJoinedOrHello(pkt, isNewPeer) {
            const remoteId = pkt.senderId;
            let remoteName = pkt.senderName || '芽芽';
            const remoteJoinedAt = pkt.joinedAt || Date.now();

            // 如果两个人名字一样（例如都默认叫“豆豆宝宝”），后进房的一方自动切换为另一个情侣名字
            const iAmEarlier = (myJoinedAt < remoteJoinedAt) || (myJoinedAt === remoteJoinedAt && myClientId < remoteId);

            if (myName === remoteName) {
                if (!iAmEarlier && !userManuallyPickedRole) {
                    myName = remoteName === '豆豆宝宝' ? '芽芽' : '豆豆宝宝';
                    document.getElementById('roleDoudouBtn').classList.toggle('active', myName === '豆豆宝宝');
                    document.getElementById('roleYayaBtn').classList.toggle('active', myName === '芽芽');
                } else {
                    remoteName = myName === '豆豆宝宝' ? '芽芽' : '豆豆宝宝';
                }
            }

            // 如果当前是单人等待期间随意试下的棋子，对方进房时立即清空棋盘正式开局！
            if (isSoloPracticeMoves) {
                isSoloPracticeMoves = false;
                board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
                moves = [];
                currentTurn = 1;
                winner = 0;
                winLine = [];
                winReason = '';
            }

            // 确定黑白棋归属（如果已有正在进行的2人棋局则保持，否则先入房者执黑，后入房者执白）
            const alreadyPaired =
                blackPlayerInfo && whitePlayerInfo &&
                ((blackPlayerInfo.id === myClientId && whitePlayerInfo.id === remoteId) ||
                 (blackPlayerInfo.id === remoteId && whitePlayerInfo.id === myClientId));

            if (!alreadyPaired) {
                if (iAmEarlier) {
                    myOnlineColor = 1;
                    blackPlayerInfo = { id: myClientId, name: myName };
                    whitePlayerInfo = { id: remoteId, name: remoteName };
                } else {
                    myOnlineColor = 2;
                    blackPlayerInfo = { id: remoteId, name: remoteName };
                    whitePlayerInfo = { id: myClientId, name: myName };
                }
            } else {
                if (blackPlayerInfo.id === myClientId) {
                    myOnlineColor = 1;
                    blackPlayerInfo.name = myName;
                    whitePlayerInfo.name = remoteName;
                } else {
                    myOnlineColor = 2;
                    whitePlayerInfo.name = myName;
                    blackPlayerInfo.name = remoteName;
                }
            }

            if (isNewPeer) {
                showRomanticToast(`🎉 ${remoteName} 已进入房间！双方连线成功，开始下棋吧`);
            }

            // 先入房的一方（或有正式棋局记录的一方）主动向对方广播完整房间状态
            if (iAmEarlier || pkt.type === 'HELLO') {
                stateVersion++;
                sendRoomPacket('WELCOME_SYNC', buildStatePayload());
            }

            updateConnectionBadge();
            refreshGomokuUI();
            drawGomokuBoard();
        }

        function pruneOfflinePeers() {
            const now = Date.now();
            let changed = false;
            for (const [pid, info] of remotePeers.entries()) {
                if (now - info.lastSeen > 9000) {
                    remotePeers.delete(pid);
                    if (whitePlayerInfo && whitePlayerInfo.id === pid) whitePlayerInfo = null;
                    if (blackPlayerInfo && blackPlayerInfo.id === pid) {
                        blackPlayerInfo = { id: myClientId, name: myName };
                        myOnlineColor = 1;
                    }
                    changed = true;
                }
            }
            if (changed) {
                updateConnectionBadge();
                refreshGomokuUI();
            }
        }

        function updateConnectionBadge() {
            const connTag = document.getElementById('connStatusTag');
            const rosterEl = document.getElementById('roomRosterText');
            const isBothOnline = blackPlayerInfo && whitePlayerInfo && remotePeers.size > 0;

            if (isBothOnline) {
                connTag.innerText = `🟢 双方已实时连线 (#${currentRoomCode}房 · 2/2人在线)`;
                rosterEl.innerHTML = `🟢 <strong>2/2 双方已连线</strong> (${blackPlayerInfo.name} vs ${whitePlayerInfo.name})`;
            } else {
                connTag.innerText = `🟢 #${currentRoomCode || '5200'}房已就绪 (1/2人 · 等待对方进房)`;
                rosterEl.innerHTML = `🟡 <strong>1/2 在线</strong>：等待对方进入 #${currentRoomCode || '5200'} 房间...`;
            }
        }

        function buildStatePayload() {
            return {
                stateVersion,
                blackPlayer: blackPlayerInfo,
                whitePlayer: whitePlayerInfo,
                moves: moves,
                turn: currentTurn,
                winner: winner,
                winReason: winReason,
                winLine: winLine
            };
        }

        function broadcastRoomState() {
            if (gameMode !== 'online' || !currentRoomCode) return;
            stateVersion++;
            sendRoomPacket('SYNC_STATE', buildStatePayload());
        }

        function applyIncomingState(state) {
            if (!state) return;
            const prevMoveLen = moves.length;
            const prevWinner = winner;

            if (state.stateVersion && state.stateVersion > stateVersion) {
                stateVersion = state.stateVersion;
            }

            if (state.blackPlayer) blackPlayerInfo = state.blackPlayer;
            if (state.whitePlayer !== undefined) whitePlayerInfo = state.whitePlayer;

            // 识别我自己在房间里是黑棋还是白棋
            if (blackPlayerInfo && blackPlayerInfo.id === myClientId) {
                myOnlineColor = 1;
                blackPlayerInfo.name = myName;
            } else if (whitePlayerInfo && whitePlayerInfo.id === myClientId) {
                myOnlineColor = 2;
                whitePlayerInfo.name = myName;
            }

            isSoloPracticeMoves = false;
            moves = state.moves || [];
            board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
            moves.forEach(m => {
                if (m.r >= 0 && m.r < BOARD_SIZE && m.c >= 0 && m.c < BOARD_SIZE) {
                    board[m.r][m.c] = m.p;
                }
            });

            currentTurn = state.turn || 1;
            winner = state.winner || 0;
            winReason = state.winReason || '';
            winLine = state.winLine || [];

            if (moves.length > prevMoveLen) {
                const last = moves[moves.length - 1];
                playStoneTap(last.p === 1);
            }
            if (winner !== 0 && prevWinner === 0) {
                playVictoryMelody();
                showVictoryBanner();
            } else if (winner === 0) {
                hideVictoryBanner();
            }

            updateConnectionBadge();
            refreshGomokuUI();
            drawGomokuBoard();
        }

        // 页面关闭时主动通知对方离线
        window.addEventListener('beforeunload', () => {
            if (gameMode === 'online' && currentRoomCode) {
                sendRoomPacket('LEAVE', {});
            }
        });

        // ==========================================
        // 功能 7：下棋落子、胜负判定、交换黑白、悔棋、认输与 AI
        // ==========================================
        function resetBoardData() {
            board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
            moves = [];
            currentTurn = 1;
            winner = 0;
            winLine = [];
            winReason = '';
            isSoloPracticeMoves = false;
            aiThinking = false;
            pendingIntersection = null;
            updateConfirmButtonUI();
            hideVictoryBanner();
            updateConnectionBadge();
            refreshGomokuUI();
            drawGomokuBoard();
        }

        function checkFiveInARow(r, c, color) {
            const dirs = [[0,1], [1,0], [1,1], [1,-1]];
            for (const [dr, dc] of dirs) {
                const line = [[r, c]];
                let nr = r + dr, nc = c + dc;
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === color) {
                    line.push([nr, nc]);
                    nr += dr; nc += dc;
                }
                nr = r - dr; nc = c - dc;
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === color) {
                    line.unshift([nr, nc]);
                    nr -= dr; nc -= dc;
                }
                if (line.length >= 5) return line;
            }
            return null;
        }

        function placeStoneAt(r, c) {
            if (winner !== 0) {
                showRomanticToast('本局已结束，请点击「再来一局」🌸');
                return;
            }
            if (board[r][c] !== 0) {
                showRomanticToast('这里已经有棋子啦～');
                return;
            }

            if (gameMode === 'online') {
                const bothSeated = blackPlayerInfo && whitePlayerInfo && remotePeers.size > 0;
                if (bothSeated) {
                    if (currentTurn !== myOnlineColor) {
                        showRomanticToast('⏳ 现在轮到对方落子哟～');
                        return;
                    }
                    isSoloPracticeMoves = false;
                } else {
                    // 对方还没进房时允许自由试下，等对方一进房会自动清空重开
                    isSoloPracticeMoves = true;
                }
            } else if (gameMode === 'ai' && (aiThinking || currentTurn !== 1)) {
                return;
            }

            const stoneColor = currentTurn;
            board[r][c] = stoneColor;
            moves.push({ r, c, p: stoneColor });
            playStoneTap(stoneColor === 1);

            const winPts = checkFiveInARow(r, c, stoneColor);
            if (winPts) {
                winner = stoneColor;
                winLine = winPts;
                winReason = 'five';
                playVictoryMelody();
                showVictoryBanner();
            } else if (moves.length >= BOARD_SIZE * BOARD_SIZE) {
                winner = 3;
                showVictoryBanner();
            } else {
                currentTurn = stoneColor === 1 ? 2 : 1;
            }

            refreshGomokuUI();
            drawGomokuBoard();

            if (gameMode === 'online') {
                broadcastRoomState();
            } else if (gameMode === 'ai' && winner === 0 && currentTurn === 2) {
                aiThinking = true;
                refreshGomokuUI();
                setTimeout(runYayaAiMove, 320);
            }
        }

        // 一键互换黑白棋先后手
        window.handleSwapColors = function() {
            if (gameMode !== 'online') return;
            if (!blackPlayerInfo || !whitePlayerInfo) {
                showRomanticToast('⏳ 等对方进入房间后即可互换黑白棋哟～');
                return;
            }
            const temp = blackPlayerInfo;
            blackPlayerInfo = whitePlayerInfo;
            whitePlayerInfo = temp;
            myOnlineColor = myOnlineColor === 1 ? 2 : 1;
            resetBoardData();
            broadcastRoomState();
            showRomanticToast(`🔃 已互换黑白棋！现在由 ${blackPlayerInfo.name} 执黑先行`);
        };

        // 芽芽 AI 启发式落子逻辑
        function runYayaAiMove() {
            if (winner !== 0 || gameMode !== 'ai') {
                aiThinking = false;
                return;
            }
            let bestMove = { r: 7, c: 7 };
            if (moves.length > 0) {
                const candidates = [];
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (board[r][c] !== 0) continue;
                        let hasNeighbor = false;
                        for (let dr = -2; dr <= 2 && !hasNeighbor; dr++) {
                            for (let dc = -2; dc <= 2 && !hasNeighbor; dc++) {
                                const nr = r + dr, nc = c + dc;
                                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] !== 0) {
                                    hasNeighbor = true;
                                }
                            }
                        }
                        if (hasNeighbor) {
                            const atk = evaluateCellScore(r, c, 2);
                            const def = evaluateCellScore(r, c, 1);
                            const center = 14 - (Math.abs(r - 7) + Math.abs(c - 7));
                            let score = atk >= 100000 ? 2000000 : def >= 100000 ? 1000000 : atk + def * (aiLevel === 'easy' ? 0.75 : 1.1) + center;
                            if (aiLevel === 'easy') score += (Math.random() - 0.5) * 600;
                            candidates.push({ r, c, score });
                        }
                    }
                }
                candidates.sort((a, b) => b.score - a.score);
                if (candidates.length > 0) bestMove = candidates[0];
            }

            aiThinking = false;
            placeStoneAt(bestMove.r, bestMove.c);
        }

        function evaluateCellScore(r, c, color) {
            const dirs = [[0,1], [1,0], [1,1], [1,-1]];
            let total = 0;
            for (const [dr, dc] of dirs) {
                let cnt = 1, open = 0;
                let nr = r + dr, nc = c + dc;
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === color) { cnt++; nr += dr; nc += dc; }
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === 0) open++;

                nr = r - dr; nc = c - dc;
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === color) { cnt++; nr -= dr; nc -= dc; }
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === 0) open++;

                if (cnt >= 5) total += 100000;
                else if (cnt === 4) total += open === 2 ? 22000 : open === 1 ? 4000 : 0;
                else if (cnt === 3) total += open === 2 ? 3200 : open === 1 ? 400 : 0;
                else if (cnt === 2) total += open === 2 ? 350 : 50;
            }
            return total;
        }

        window.switchMode = function(mode) {
            gameMode = mode;
            document.getElementById('tabOnline').classList.toggle('active', mode === 'online');
            document.getElementById('tabAi').classList.toggle('active', mode === 'ai');
            document.getElementById('tabLocal').classList.toggle('active', mode === 'local');

            document.getElementById('onlineRoomCard').style.display = mode === 'online' ? 'block' : 'none';
            document.getElementById('aiSettingCard').style.display = mode === 'ai' ? 'block' : 'none';

            resetBoardData();
            if (mode === 'online' && currentRoomCode) {
                announceHello();
            }
        };

        window.setAiLevel = function(lvl) {
            aiLevel = lvl;
            document.getElementById('aiEasyBtn').classList.toggle('active', lvl === 'easy');
            document.getElementById('aiMedBtn').classList.toggle('active', lvl === 'medium');
            document.getElementById('aiHardBtn').classList.toggle('active', lvl === 'hard');
            resetBoardData();
            showRomanticToast('🤖 已更新芽芽 AI 难度');
        };

        window.handleRestartMatch = function() {
            if (gameMode === 'online' && blackPlayerInfo && whitePlayerInfo) {
                const temp = blackPlayerInfo;
                blackPlayerInfo = whitePlayerInfo;
                whitePlayerInfo = temp;
                myOnlineColor = myOnlineColor === 1 ? 2 : 1;
            }
            resetBoardData();
            if (gameMode === 'online') broadcastRoomState();
            showRomanticToast('🔄 新一局开始啦！');
        };

        window.handleUndo = function() {
            if (moves.length === 0 || winner !== 0) return;
            const steps = (gameMode === 'ai' && moves.length >= 2) ? 2 : 1;
            for (let i = 0; i < steps; i++) {
                const popped = moves.pop();
                if (popped) board[popped.r][popped.c] = 0;
            }
            currentTurn = moves.length % 2 === 0 ? 1 : 2;
            refreshGomokuUI();
            drawGomokuBoard();
            if (gameMode === 'online') {
                broadcastRoomState();
                sendCoupleChat('↩️ 耍赖悔一步棋嘛～');
            }
        };

        window.handleResign = function() {
            if (moves.length === 0 || winner !== 0) return;
            const loserColor = gameMode === 'online' ? myOnlineColor : currentTurn;
            winner = loserColor === 1 ? 2 : 1;
            winReason = 'resign';
            playVictoryMelody();
            showVictoryBanner();
            refreshGomokuUI();
            drawGomokuBoard();
            if (gameMode === 'online') {
                broadcastRoomState();
                sendCoupleChat('🏳️ 这一局认输啦，再来一局！');
            }
        };

        // ==========================================
        // 功能 8：情侣互动气泡与 UI 状态刷新
        // ==========================================
        window.sendCoupleChat = function(text) {
            const myCardColor = gameMode === 'online' ? myOnlineColor : 1;
            showChatBubbleOnCard(myCardColor, text);

            if (gameMode === 'online') {
                sendRoomPacket('CHAT_MSG', { color: myCardColor, text });
            } else if (gameMode === 'ai') {
                setTimeout(() => {
                    const replies = ['😘 豆豆下得真棒！', '🌸 芽芽永远让着豆豆～', '✨ 再来一盘嘛！'];
                    showChatBubbleOnCard(2, replies[Math.floor(Math.random() * replies.length)]);
                }, 650);
            }
        };

        window.sendCustomChatInput = function() {
            const inp = document.getElementById('chatTextInput');
            const val = inp.value.trim();
            if (!val) return;
            inp.value = '';
            sendCoupleChat(val);
        };

        function showChatBubbleOnCard(color, text) {
            const id = color === 1 ? 'blackBubble' : 'whiteBubble';
            const el = document.getElementById(id);
            if (!el) return;
            el.innerText = text;
            el.classList.remove('show');
            void el.offsetWidth;
            el.classList.add('show');
        }

        function refreshGomokuUI() {
            const blackCard = document.getElementById('blackCard');
            const whiteCard = document.getElementById('whiteCard');
            const blackNameEl = document.getElementById('blackNameLabel');
            const whiteNameEl = document.getElementById('whiteNameLabel');
            const blackMeTag = document.getElementById('blackMeTag');
            const whiteMeTag = document.getElementById('whiteMeTag');
            const blackDot = document.getElementById('blackPresenceDot');
            const whiteDot = document.getElementById('whitePresenceDot');
            const blackSubEl = document.getElementById('blackStatusLabel');
            const whiteSubEl = document.getElementById('whiteStatusLabel');
            const bannerEl = document.getElementById('statusBannerText');

            document.getElementById('moveCountText').innerText = moves.length;

            if (gameMode === 'online') {
                const bothOnline = blackPlayerInfo && whitePlayerInfo && remotePeers.size > 0;
                const bName = blackPlayerInfo ? blackPlayerInfo.name : '等待入座...';
                const wName = whitePlayerInfo ? whitePlayerInfo.name : '等待加入...';

                blackNameEl.innerText = `${bName} (黑棋)`;
                whiteNameEl.innerText = `${wName} (白棋)`;

                blackMeTag.style.display = (blackPlayerInfo && blackPlayerInfo.id === myClientId) ? 'inline-block' : 'none';
                whiteMeTag.style.display = (whitePlayerInfo && whitePlayerInfo.id === myClientId) ? 'inline-block' : 'none';

                blackDot.classList.toggle('online', !!blackPlayerInfo);
                whiteDot.classList.toggle('online', bothOnline);

                if (winner !== 0) {
                    const winName = winner === 1 ? bName : wName;
                    bannerEl.innerText = `🏆 恭喜 ${winName} 获胜！点击下方「再来一局」继续切磋`;
                } else if (!bothOnline) {
                    bannerEl.innerText = `💖 房间 #${currentRoomCode || '5200'}：等待对方进入相同房间号（当前可先试下，对方进房自动开局）`;
                } else {
                    const isMine = currentTurn === myOnlineColor;
                    const myStoneText = myOnlineColor === 1 ? '黑棋' : '白棋';
                    const otherName = myOnlineColor === 1 ? wName : bName;
                    bannerEl.innerText = isMine
                        ? `👉 轮到你 (${myStoneText}) 落子啦！快点棋盘下子吧`
                        : `⏳ 对方 (${otherName}) 正在认真思考落子...`;
                }

                blackSubEl.innerText = currentTurn === 1 && winner === 0 ? '🟢 在线 · ⚡ 当前落子方' : '🟢 在线 · 先手执黑';
                whiteSubEl.innerText = !bothOnline
                    ? '🟡 等待对方进入房间...'
                    : (currentTurn === 2 && winner === 0 ? '🟢 在线 · ⚡ 当前落子方' : '🟢 在线 · 后手执白');

            } else if (gameMode === 'ai') {
                blackNameEl.innerText = `${myName} (黑棋)`;
                whiteNameEl.innerText = `芽芽 AI (白棋)`;
                blackMeTag.style.display = 'inline-block';
                whiteMeTag.style.display = 'none';
                blackDot.classList.add('online');
                whiteDot.classList.add('online');

                bannerEl.innerText = winner !== 0
                    ? (winner === 1 ? `🎉 哇！${myName}赢了芽芽 AI！` : '🤖 芽芽 AI 险胜一招，再来一局！')
                    : (aiThinking ? '🤖 芽芽 AI 正在思考...' : `👉 轮到 ${myName} 落子啦`);

                blackSubEl.innerText = currentTurn === 1 && winner === 0 ? '⚡ 当前落子方' : '先手执黑';
                whiteSubEl.innerText = currentTurn === 2 && winner === 0 ? '⚡ 当前落子方' : '后手执白';
            } else {
                blackNameEl.innerText = '豆豆宝宝 (黑棋)';
                whiteNameEl.innerText = '芽芽 (白棋)';
                blackMeTag.style.display = 'none';
                whiteMeTag.style.display = 'none';
                blackDot.classList.add('online');
                whiteDot.classList.add('online');

                bannerEl.innerText = winner !== 0
                    ? (winner === 1 ? '🎉 豆豆宝宝 (黑棋) 获胜！' : '🎉 芽芽 (白棋) 获胜！')
                    : (currentTurn === 1 ? '👉 轮到【豆豆 (黑棋)】落子' : '👉 轮到【芽芽 (白棋)】落子');

                blackSubEl.innerText = currentTurn === 1 && winner === 0 ? '⚡ 当前落子方' : '先手执黑';
                whiteSubEl.innerText = currentTurn === 2 && winner === 0 ? '⚡ 当前落子方' : '后手执白';
            }

            blackCard.classList.toggle('active-turn', winner === 0 && currentTurn === 1);
            whiteCard.classList.toggle('active-turn', winner === 0 && currentTurn === 2);
        }

        function showVictoryBanner() {
            const banner = document.getElementById('victoryBanner');
            const title = document.getElementById('victoryTitle');
            const bName = document.getElementById('blackNameLabel').innerText;
            const wName = document.getElementById('whiteNameLabel').innerText;
            if (winner === 3) {
                title.innerText = '🤝 心有灵犀，本局平局！';
            } else {
                const winnerText = winner === 1 ? bName : wName;
                title.innerText = `🎉 ${winnerText} 获胜啦！(${winReason === 'resign' ? '对方认输' : '五子连珠'})`;
            }
            banner.style.display = 'flex';
        }

        window.hideVictoryBanner = function() {
            document.getElementById('victoryBanner').style.display = 'none';
        };

        // ==========================================
        // 功能 9：15×15 唯美棋盘绘制与触屏防误触交互
        // ==========================================
        const canvas = document.getElementById('gomokuCanvas');
        const ctx = canvas.getContext('2d');
        let metrics = { size: 420, pad: 28, cell: 26 };

        function resizeBoardCanvas() {
            const box = canvas.parentElement.getBoundingClientRect();
            if (box.width < 50) return;
            const dpr = window.devicePixelRatio || 1;
            const cssSize = Math.floor(Math.min(box.width, box.height) - 10);

            canvas.style.width = cssSize + 'px';
            canvas.style.height = cssSize + 'px';
            canvas.width = Math.floor(cssSize * dpr);
            canvas.height = Math.floor(cssSize * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const pad = Math.max(22, Math.floor(cssSize * 0.068));
            const cell = (cssSize - pad * 2) / (BOARD_SIZE - 1);
            metrics = { size: cssSize, pad, cell };
            drawGomokuBoard();
        }
        window.addEventListener('resize', resizeBoardCanvas);

        function drawGomokuBoard() {
            const { size, pad, cell } = metrics;
            ctx.clearRect(0, 0, size, size);

            // 1. 棋盘网格线
            ctx.strokeStyle = 'rgba(72, 40, 14, 0.78)';
            ctx.lineWidth = 1.1;
            for (let i = 0; i < BOARD_SIZE; i++) {
                const p = pad + i * cell;
                ctx.beginPath(); ctx.moveTo(pad, p); ctx.lineTo(size - pad, p); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(p, pad); ctx.lineTo(p, size - pad); ctx.stroke();
            }

            // 2. 坐标刻度
            ctx.fillStyle = 'rgba(72, 40, 14, 0.8)';
            ctx.font = `600 ${Math.max(9, Math.floor(cell * 0.34))}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 0; i < BOARD_SIZE; i++) {
                const pos = pad + i * cell;
                ctx.fillText(COL_LETTERS[i], pos, pad * 0.42);
                ctx.fillText(String(BOARD_SIZE - i), pad * 0.42, pos);
            }

            // 3. 星位与天元
            for (const [sr, sc] of STAR_COORDS) {
                ctx.beginPath();
                ctx.arc(pad + sc * cell, pad + sr * cell, Math.max(3, cell * 0.12), 0, Math.PI * 2);
                ctx.fillStyle = '#48280e';
                ctx.fill();
            }

            // 4. 预览或手机防误触准星
            const aim = pendingIntersection || hoverIntersection;
            if (aim && winner === 0 && board[aim.r][aim.c] === 0) {
                const ax = pad + aim.c * cell;
                const ay = pad + aim.r * cell;
                const rad = cell * 0.44;
                ctx.save();
                ctx.beginPath();
                ctx.arc(ax, ay, rad, 0, Math.PI * 2);
                ctx.fillStyle = currentTurn === 1 ? 'rgba(20,20,20,0.35)' : 'rgba(255,255,255,0.55)';
                ctx.fill();
                if (pendingIntersection) {
                    ctx.strokeStyle = '#ff4d79';
                    ctx.lineWidth = 2.2;
                    ctx.stroke();
                }
                ctx.restore();
            }

            // 5. 3D 立体黑白棋子
            const rStone = cell * 0.45;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const v = board[r][c];
                    if (v === 0) continue;
                    const cx = pad + c * cell;
                    const cy = pad + r * cell;

                    ctx.save();
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.38)';
                    ctx.shadowBlur = rStone * 0.4;
                    ctx.shadowOffsetX = rStone * 0.1;
                    ctx.shadowOffsetY = rStone * 0.15;

                    ctx.beginPath();
                    ctx.arc(cx, cy, rStone, 0, Math.PI * 2);
                    if (v === 1) {
                        const g = ctx.createRadialGradient(cx - rStone * 0.3, cy - rStone * 0.3, rStone * 0.08, cx, cy, rStone);
                        g.addColorStop(0, '#666');
                        g.addColorStop(0.3, '#262626');
                        g.addColorStop(1, '#080808');
                        ctx.fillStyle = g;
                    } else {
                        const g = ctx.createRadialGradient(cx - rStone * 0.3, cy - rStone * 0.3, rStone * 0.08, cx, cy, rStone);
                        g.addColorStop(0, '#ffffff');
                        g.addColorStop(0.7, '#f2efec');
                        g.addColorStop(1, '#cdc6be');
                        ctx.fillStyle = g;
                    }
                    ctx.fill();
                    ctx.restore();
                }
            }

            // 6. 最新一步红点标记
            if (moves.length > 0) {
                const last = moves[moves.length - 1];
                const lx = pad + last.c * cell;
                const ly = pad + last.r * cell;
                ctx.beginPath();
                ctx.arc(lx, ly, Math.max(3.5, cell * 0.15), 0, Math.PI * 2);
                ctx.fillStyle = '#ff3b6b';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }

            // 7. 五子连珠高光连线
            if (winLine && winLine.length >= 5) {
                const p1 = winLine[0];
                const p2 = winLine[winLine.length - 1];
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(pad + p1[1] * cell, pad + p1[0] * cell);
                ctx.lineTo(pad + p2[1] * cell, pad + p2[0] * cell);
                ctx.strokeStyle = 'rgba(255, 77, 121, 0.88)';
                ctx.lineWidth = Math.max(4, cell * 0.16);
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.restore();
            }
        }

        function getGridPointFromEvent(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            const { pad, cell } = metrics;
            const c = Math.round((x - pad) / cell);
            const r = Math.round((y - pad) / cell);
            if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) return null;
            return { r, c };
        }

        window.toggleAimMode = function() {
            if (aimSetting === 'auto') aimSetting = 'on';
            else if (aimSetting === 'on') aimSetting = 'off';
            else aimSetting = 'auto';

            const txt = aimSetting === 'auto' ? '自动' : aimSetting === 'on' ? '开启' : '关闭';
            document.getElementById('aimModeBtn').innerText = `🎯 防误触: ${txt}`;
            pendingIntersection = null;
            updateConfirmButtonUI();
            drawGomokuBoard();
        };

        function shouldUseTwoStepConfirm() {
            if (aimSetting === 'on') return true;
            if (aimSetting === 'off') return false;
            return isTouchUsed || window.innerWidth < 640;
        }

        function updateConfirmButtonUI() {
            const btn = document.getElementById('confirmMoveBtn');
            const span = document.getElementById('confirmCoordText');
            if (pendingIntersection && winner === 0) {
                span.innerText = `${COL_LETTERS[pendingIntersection.c]}${BOARD_SIZE - pendingIntersection.r}`;
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
        }

        window.confirmPendingStone = function() {
            if (!pendingIntersection) return;
            const { r, c } = pendingIntersection;
            pendingIntersection = null;
            updateConfirmButtonUI();
            placeStoneAt(r, c);
        };

        canvas.addEventListener('touchstart', () => { isTouchUsed = true; }, { passive: true });

        canvas.addEventListener('mousemove', (e) => {
            if (isTouchUsed) return;
            const pt = getGridPointFromEvent(e.clientX, e.clientY);
            if (pt?.r !== hoverIntersection?.r || pt?.c !== hoverIntersection?.c) {
                hoverIntersection = pt;
                drawGomokuBoard();
            }
        });

        canvas.addEventListener('mouseleave', () => {
            hoverIntersection = null;
            drawGomokuBoard();
        });

        canvas.addEventListener('click', (e) => {
            const pt = getGridPointFromEvent(e.clientX, e.clientY);
            if (!pt) return;
            if (board[pt.r][pt.c] !== 0) {
                showRomanticToast('这里已经有棋子啦～');
                return;
            }
            // 在联机模式下如果双方已就座且没轮到自己，直接提示，不弹确认框
            if (gameMode === 'online' && blackPlayerInfo && whitePlayerInfo && remotePeers.size > 0 && currentTurn !== myOnlineColor) {
                showRomanticToast('⏳ 现在轮到对方落子哟～');
                return;
            }
            if (shouldUseTwoStepConfirm()) {
                if (pendingIntersection && pendingIntersection.r === pt.r && pendingIntersection.c === pt.c) {
                    confirmPendingStone();
                } else {
                    pendingIntersection = pt;
                    updateConfirmButtonUI();
                    drawGomokuBoard();
                }
            } else {
                placeStoneAt(pt.r, pt.c);
            }
        });

        // 检查网址是否带有 ?room=XXXX 参数（点击 Bark 推送通知打开时直接进房！）
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const roomParam = params.get('room');
            if (roomParam) {
                selectIdentity('芽芽', true);
                openGomokuRoom(roomParam);
            }
        });
    </script>
</body>
