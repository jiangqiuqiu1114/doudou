<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 让网页在手机端也能完美按比例显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>doudou</title>
    <style>
        /* 1. 清除浏览器默认边距 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 2. 梦幻渐变动态背景 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* 粉紫橘浪漫渐变背景 */
            background: linear-gradient(135deg, #ffd3b6 0%, #ffaaa5 40%, #d4a5b8 80%, #a8e6cf 100%);
            background-size: 300% 300%;
            animation: gradientBG 15s ease infinite; /* 缓慢的背景流动动画 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 背景流动的动画 keyframe */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 3. 装饰性漂浮泡泡 */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(2px);
            animation: floatUpDown 8s ease-in-out infinite alternate;
            pointer-events: none;
        }
        .bubble:nth-child(1) { width: 120px; height: 120px; top: 10%; left: 8%; animation-delay: 0s; }
        .bubble:nth-child(2) { width: 80px; height: 80px; bottom: 15%; right: 10%; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 50px; height: 50px; bottom: 20%; left: 15%; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 70px; height: 70px; top: 15%; right: 20%; animation-delay: 1s; }

        @keyframes floatUpDown {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.05); }
        }

        /* 4. 磨砂玻璃质感卡片 */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85); /* 半透明白色 */
            backdrop-filter: blur(16px); /* 磨砂玻璃模糊 */
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6); /* 彩色微光边框 */
            padding: 45px 30px;
            border-radius: 28px; /* 大圆角更亲切 */
            box-shadow: 
                0 20px 40px rgba(255, 154, 159, 0.15), 
                0 1px 3px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.8); /* 柔和内外多重阴影 */
            text-align: center;
            width: 90%;
            max-width: 390px;
            transition: transform 0.4s ease;
        }

        /* 5. 豆豆专属 Badge 小标 */
        .badge {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #ff9a9f 0%, #fecfef 100%);
            border-radius: 50%;
            margin-bottom: 18px;
            box-shadow: 0 4px 10px rgba(255, 154, 159, 0.3);
            font-size: 24px;
            color: #ffffff;
            font-weight: bold;
            animation: heartbeat 2s infinite ease-in-out;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

        h2 {
            color: #4a3e3d;
            margin-bottom: 12px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 14px;
            color: #8b7c7a;
            margin-bottom: 30px;
        }

        /* 6. 交互式文本框 */
        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 45px 15px 18px; /* 留出右边清空小按钮的位置 */
            border: 1.5px solid #eae1df;
            border-radius: 16px;
            font-size: 15px;
            outline: none;
            background-color: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            color: #4a3e3d;
        }

        /* 输入框选中发光效果 */
        input[type="text"]:focus {
            border-color: #ff9a9f;
            background-color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 154, 159, 0.25);
        }

        /* 清空小按钮 */
        .clear-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #c0b4b2;
            cursor: pointer;
            display: none; /* 默认隐藏，有字才显示 */
            font-size: 18px;
            padding: 5px;
            transition: color 0.2s;
        }
        .clear-btn:hover {
            color: #ff9a9f;
        }

        /* 7. 灵动召唤按钮 */
        button#sendBtn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff9a9f 0%, #fecfef 100%); /* 华丽粉红渐变 */
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 154, 159, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 灵动回弹 */
        }

        /* 鼠标悬浮及点击动作 */
        button#sendBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 154, 159, 0.5);
            filter: brightness(1.03);
        }

        button#sendBtn:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: 0 3px 10px rgba(255, 154, 159, 0.3);
        }

        button#sendBtn:disabled {
            background: #d8cfcd;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <!-- 漂浮气泡装饰 -->
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    
    <!-- 主卡片 -->
    <div class="container">
        <!-- 豆字 Badge -->
        <div class="badge">豆</div>
        <h2>欢迎豆豆宝宝!</h2>
        <p class="subtitle">有什么想和芽芽说的，写在这里吧 💌</p>
        
        <div class="input-group">
            <input type="text" id="messageInput" placeholder="在这里输入想说的话..." autocomplete="off">
            <button class="clear-btn" id="clearBtn" title="清空">✕</button>
        </div>
        
        <button id="sendBtn">召唤芽芽</button>
    </div>

    <script>
        // ==========================================
        // 功能 1：无感推送网页访问日志
        // ==========================================
        function logPageVisit() {
            const logData = new URLSearchParams();
            logData.append('title', '👀 豆豆宝宝来啦');
            logData.append('body', '豆豆宝宝刚刚打开或刷新了网页！');
            logData.append('group', 'log'); 
            logData.append('isArchive', '1'); 

            fetch('https://api.day.app/t7Ay4FrKptb7NrhMw5xBG7', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: logData
            }).catch(error => console.error('后台日志推送失败:', error)); 
        }

        window.addEventListener('load', logPageVisit);

        // ==========================================
        // UI 辅助：输入框非空判断与清空按钮交互
        // ==========================================
        const messageInput = document.getElementById('messageInput');
        const clearBtn = document.getElementById('clearBtn');

        // 检测输入，有字才显示清除“✕”号
        messageInput.addEventListener('input', function() {
            if (messageInput.value.length > 0) {
                clearBtn.style.display = 'block';
            } else {
                clearBtn.style.display = 'none';
            }
        });

        clearBtn.addEventListener('click', function() {
            messageInput.value = '';
            clearBtn.style.display = 'none';
            messageInput.focus();
        });

        // ==========================================
        // 功能 2：手动点击按钮推送
        // ==========================================
        const sendBtn = document.getElementById('sendBtn');

        sendBtn.addEventListener('click', function() {
            const inputValue = messageInput.value.trim();

            if (!inputValue) {
                alert('请先输入内容呀！');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerText = '发送中...';

            const data = new URLSearchParams();
            data.append('title', 'doudou 网页留言'); 
            data.append('body', inputValue);         
            data.append('group', 'example');
            data.append('isArchive', '1'); 

            fetch('https://api.day.app/t7Ay4FrKptb7NrhMw5xBG7', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: data
            })
            .then(response => response.json())
            .then(data => {
                alert('发送成功啦！🌸');
                messageInput.value = ''; 
                clearBtn.style.display = 'none'; // 成功后隐藏清除按钮
            })
            .catch(error => {
                alert('发送失败，请检查网络！');
                console.error('Error:', error);
            })
            .finally(() => {
                sendBtn.disabled = false;
                sendBtn.innerText = '召唤芽芽';
            });
        });
    </script>
</body>
</html>
